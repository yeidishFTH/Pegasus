name: PULSE ARCADE smoke
on:
  push:
    branches: [hypergrid-commercial]
    paths:
      - 'pulse-grid/**'
      - '.github/workflows/pulse-arcade.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser game scripts, assets and site structure
        run: node pulse-grid/check.mjs
      - name: Verify licensing inquiry, PayPal offer gating and individual buyer paths
        run: node pulse-grid/license-order-smoke.mjs
      - name: Verify AFTERSHOCK deterministic gameplay and clockwork crate physics
        run: node pulse-grid/aftershock/qa-core.cjs
      - name: Validate AFTERSHOCK FOUNDRY six-room physics and machinery
        run: node pulse-grid/aftershock/qa-foundry.cjs
      - name: Verify publisher review ZIP integrity and runnable scripts
        run: python3 pulse-grid/verify_packs.py

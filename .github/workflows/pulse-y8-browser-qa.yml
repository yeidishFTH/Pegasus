name: PULSE Y8 isolated browser QA
on:
  push:
    branches:
      - pulse-grid-y8-staging-20261111
    paths:
      - 'pulse-grid/platform-builds/y8/**'
      - '.github/workflows/pulse-y8-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Y8 Chromium QA script syntax
        run: node --check pulse-grid/platform-builds/y8/qa-browser.mjs
      - name: Install browser automation library without project installation
        working-directory: pulse-grid/platform-builds/y8
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.57.0
      - name: Run isolated desktop/mobile gameplay and fake SDK checks
        run: node pulse-grid/platform-builds/y8/qa-browser.mjs

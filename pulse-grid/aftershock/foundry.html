$('world').addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;let d=Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy);if(d<6&&!pointer.moved)return;pointer.moved=true;let start=renderer.ground(pointer.sx,pointer.sy,0),cur=renderer.ground(e.clientX,e.clientY,0);let vx=(start.x-cur.x)*3.5,vz=(start.z-cur.z)*3.5,n=Math.hypot(vx,vz),max=TYPES[state.bodies[state.active].type].maxSpeed;if(n>max){vx*=max/n;vz*=max/n}aim={...pointer,px:e.clientX,py:e.clientY,vx,vz};$('aimhint').hidden=false});
function release(e){if(!pointer||pointer.id!==e.pointerId)return;if(e.type==='pointercancel'){aim=null;pointer=null;$('aimhint').hidden=true;return}if(pointer.moved&&aim)shoot(aim.vx,aim.vz);else if(pointer.target>=0)possess(pointer.target);pointer=null;aim=null;$('aimhint').hidden=true;pathDots.forEach(n=>n.visible=false)}
$('world').addEventListener('pointerup',release);$('world').addEventListener('pointercancel',release);$('world').addEventListener('lostpointercapture',()=>{pointer=null;aim=null;$('aimhint').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('dialog').open)return;if(mode==='play'){e.preventDefault();openDialog('pause')}return}if(mode!=='play'||$('dialog').open||state.complete)return;if(['1','2','3'].includes(e.key)){possess(Number(e.key)-1);return}if(e.key.toLowerCase()==='e'){pulse();return}if(e.key.toLowerCase()==='q'){polarity();return}if(e.key.toLowerCase()==='z'){undo();return}if(e.key.toLowerCase()==='r'){start(state.index);return}if(e.code==='Space'){e.preventDefault();shoot(keyAim.x,keyAim.z);return}if(e.key.startsWith('Arrow')){e.preventDefault();keyAim.x=clamp(keyAim.x+(e.key==='ArrowLeft'?-1.0:e.key==='ArrowRight'?1.0:0),-13,13);keyAim.z=clamp(keyAim.z+(e.key==='ArrowUp'?-1.0:e.key==='ArrowDown'?1.0:0),-13,13);aim={vx:keyAim.x,vz:keyAim.z,sx:W/2,sy:H/2,px:W/2-keyAim.x*5,py:H/2+keyAim.z*5};$('aimhint').hidden=false}});
$('play').addEventListener('click',()=>start(save.last??3));$('rooms').addEventListener('click',()=>openDialog('rooms'));$('help').addEventListener('click',()=>openDialog('help'));$('settings').addEventListener('click',()=>openDialog('settings'));$('publishers').addEventListener('click',()=>openDialog('license'));$('pause').addEventListener('click',()=>openDialog('pause'));$('brand').addEventListener('click',()=>{if(mode==='play')openDialog('pause')});$('close').addEventListener('click',closeDialog);$('dialog').addEventListener('cancel',()=>{if(sound.ctx&&sound.on&&!document.hidden)sound.ctx.resume()});$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){let r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});$('sound').addEventListener('click',()=>sound.toggle());$('lang').addEventListener('click',()=>{settings.lang=settings.lang==='he'?'en':'he';persist();langUI();if($('dialog').open)openDialog(dialogType)});$('pulse').addEventListener('click',pulse);$('polarity').addEventListener('click',polarity);$('undo').addEventListener('click',undo);$('restart').addEventListener('click',()=>start(state.index));addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play'&&!$('dialog').open&&!state.complete)openDialog('pause');if(sound.ctx)sound.ctx.suspend();last=0;accum=0}else{if(sound.ctx&&sound.on&&!$('dialog').open)sound.ctx.resume();last=0;accum=0}});$('world').addEventListener('webglcontextlost',e=>{e.preventDefault();stats.contextLosses++;toast(t('lost'),10000)});$('world').addEventListener('webglcontextrestored',()=>location.reload());
function frame(now){requestAnimationFrame(frame);if(document.hidden)return;let dt=last?Math.min(.05,(now-last)/1000):1/60;last=now;time+=dt;if(mode==='home'&&!$('dialog').open)homeDemo(dt);stats.frames++;if(dt>.033)stats.slowFrames++;if(mode==='play'&&!$('dialog').open&&!aim&&!pointer&&!state.complete){accum+=dt;let n=0;while(accum>=1/120&&n<8){Phys.step(state,1/120);accum-=1/120;n++}levelTime+=dt;processEvents()}else accum=0;if(successTimer>=0&&!$('dialog').open){successTimer-=dt;if(successTimer<0)openDialog('result')}if(!$('dialog').open)sound.ambient(time);camera();updateVisual($('dialog').open?0:dt);renderer.render(root);drawFX();if(mode==='play')updateHUD()}
resize();buildScene(3);langUI();camera();updateVisual(0);renderer.render(root);$('loading').style.opacity='0';setTimeout(()=>$('loading').hidden=true,400);requestAnimationFrame(frame);
// Read-only diagnostic state is always available. Mutation helpers exist only with explicit ?test=1.
window.AFTERSHOCK={version:'2.0.0',getState:()=>Phys.clone(state),getStats:()=>({...stats}),project:(x,z,y=.6)=>renderer.project([x,y,z]),getRenderInfo:()=>({width:renderer.canvas.width,height:renderer.canvas.height,shadowMap:renderer.shadowOK,backend:renderer.backend,low:renderer.low,geometries:renderer.cache.size}),getMode:()=>mode};
if(new URLSearchParams(location.search).get('test')==='1'){Object.assign(window.AFTERSHOCK,{start,shoot,pulse,possess,polarity,step:(seconds)=>{let n=Math.round(seconds*120);for(let i=0;i<n;i++)Phys.step(state,1/120);processEvents();updateVisual(0);updateHUD();return Phys.clone(state)},setBody:(id,x,z)=>{state.bodies[id].x=x;state.bodies[id].z=z;state.bodies[id].vx=state.bodies[id].vz=state.bodies[id].vy=0;state.bodies[id].y=0;state.bodies[id].home=[x,z]},undo,closeDialog});}
